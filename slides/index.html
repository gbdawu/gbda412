    function editorJsToHtml(editorData) {
      if (!editorData || !editorData.blocks || !Array.isArray(editorData.blocks)) return '';

      return editorData.blocks.map(block => {
        if (!block) return '';

        // Mover aquí la extracción de alineación para que lea el 'block' activo de la iteración
        const align = block.tunes?.alignmentTune?.alignment || block.data?.alignment || 'left';
        const alignStyle = `style="text-align: ${align} !important;"`;


        switch (block.type) {
          // ---> CASO DE COLUMNAS <---
          // case 'columns':
          //   const cols = block.data?.cols || [];
          //   const columnsHtml = cols.map(col => {
          //     // Procesa de forma recursiva los bloques dentro de cada columna
          //     const colContent = editorJsToHtml({ blocks: col.blocks || [] });
          //     return `<div class="editor-column">${colContent}</div>`;
          //   }).join('');

          //   return `<div class="editor-columns-container">${columnsHtml}</div>`;

          case 'table':
            const content = block.data?.content || [];
            const rowsHtml = content.map(row => {
              const cellsHtml = row.map(cell => `<td>${cell || ''}</td>`).join('');
              return `<tr>${cellsHtml}</tr>`;
            }).join('');

            return `<table class="invisible-table">${rowsHtml}</table>`;

          case 'header':
            return `<h${block.data?.level || 2} ${alignStyle}>${block.data?.text || ''}</h${block.data?.level || 2}>`;

          case 'paragraph':
            const textWithBreaks = (block.data?.text || '').replace(/\n/g, '<br>');
            return `<p ${alignStyle}>${textWithBreaks}</p>`;

          case 'list':
            const tag = block.data?.style === 'ordered' ? 'ol' : 'ul';
            const renderItems = (items) => items.map(item => {
              const text = typeof item === 'string' ? item : (item.content || '');
              const subItems = item.items && item.items.length > 0 ? `<${tag}>${renderItems(item.items)}</${tag}>` : '';
              return `<li>${text}${subItems}</li>`;
            }).join('');
            return `<${tag} ${alignStyle}>${renderItems(block.data?.items || [])}</${tag}>`;

          case 'image':
            const imgUrl = block.data?.file?.url || '';
            if (!imgUrl) return '';
            const caption = block.data?.caption ? `<figcaption>${block.data.caption}</figcaption>` : '';
            return `<figure ${alignStyle}><img src="${imgUrl}" style="max-height: 400px; margin: 0 auto; display: block;" />${caption}</figure>`;

          case 'embed':
            return `<iframe data-src="${block.data?.embed || ''}" width="100%" height="400px" frameborder="0" allowfullscreen></iframe>`;

          case 'quote':
            return `<blockquote ${alignStyle}>${block.data?.text || ''} <cite>${block.data?.caption || ''}</cite></blockquote>`;

          case 'raw':
            return block.data?.html || '';

          default:
            return '';
        }
      }).join('\n');
    }

    `,
      setup() {
        const revealRef = ref(null);
        let revealInstance = null;
        let editorInstance = null;

        const currentId = ref(null);
        const presentationTitle = ref('Nueva Presentación Editor.js');
        const currentCourse = ref('General');
        const listaCursos = ref(['General', 'Diseño Web', 'Base de Datos', 'Audiovisual']);

        const slides = ref([
          {
            blocks: [
              { type: 'header', data: { text: 'Título de la Diapositiva 1', level: 2 } },
              { type: 'paragraph', data: { text: 'Haz clic aquí para editar con Editor.js...' } }
            ]
          }
        ]);

        const activeSlideIndex = ref(0);
        const cargandoGuardado = ref(false);
        const cargandoEliminar = ref(false);
        const cargandoLista = ref(false);

        const listaPresentaciones = ref([]);
        const selectedPresentationId = ref(null);

        // Variables reactivas para el diálogo del iFrame
        const dialogEmbed = ref(false);
        const iframeCode = ref('');
        const textoBotonCopiar = ref('Copiar Código');


        // Variables reactivas para el Modal
        const mostrarModalForo = ref(false);
        const pasoModal = ref(1);
        const sessionIdInput = ref('');
        const adminUrlIframe = ref('');

        // Abrir el modal desde el botón de la barra de herramientas

          sessionIdInput.value = `session-${Date.now().toString().slice(-6)}`;
          pasoModal.value = 1;
          mostrarModalForo.value = true;
        };

        // Cerrar Modal
        const cerrarModalForo = () => {
          mostrarModalForo.value = false;
        };

        // Avanzar al Paso 2: Cargar la interfaz Admin en el Iframe
        const irAlPaso2 = () => {
          if (!sessionIdInput.value.trim()) return;

          const cleanId = sessionIdInput.value.trim();
          const baseUrl = "https://dmgc-courses.github.io/discussions/index.html";

          // Construir la URL de administración
          adminUrlIframe.value = `${baseUrl}?session=${cleanId}&admin=profesor123`;
          pasoModal.value = 2;
        };

        // Paso 3: Confirmar e Insertar en Editor.js
        const confirmarEIncrustarForo = () => {
          const cleanId = sessionIdInput.value.trim();
          const studentUrl = `https://dmgc-courses.github.io/discussions/index.html?session=${cleanId}`;

          // Formato HTML para Reveal.js iframe
          const htmlRaw = `<section data-background-iframe="${studentUrl}" data-background-interactive>\n</section>`;

          if (editorInstance) {
            editorInstance.blocks.insert('raw', {
              html: htmlRaw
            });
            cerrarModalForo();
          } else {
            console.warn("La instancia de Editor.js aún no está lista.");
          }
        };

        // Función adaptada para Vue
        // Función adaptada para Vue (usando la variable let editorInstance)
        const agregarFondoForo = () => {
          const url = prompt("Introduce la URL del foro de discusión:");

            console.warn("La instancia de Editor.js aún no está lista.");

          try {
            await navigator.clipboard.writeText(iframeCode.value);

            alert('Error al copiar al portapapeles: ' + err.message);

          // Sanitizar el objeto eliminando Proxies de Vue
          let cleanData = { blocks: [] };

            cleanData = JSON.parse(JSON.stringify(dataInicial));
            // Asegurar que ningún bloque párrafo/header tenga texto undefined
            cleanData.blocks = cleanData.blocks.map(block => {
              if (!block.data) block.data = {};
              if (block.type === 'paragraph' || block.type === 'header') {
                if (typeof block.data.text !== 'string') block.data.text = '';
              }
              return block;

            cleanData = {
              blocks: [

              table: {

              // marker: { class: Marker },

              // Herramienta 1: Resaltador de Fondo (Marker)
              Marker: {
                class: window.ColorPlugin,
                config: {
                  colorCollections: ['#FFF066', '#A0FE00', '#00E5FF', '#FFB74D', '#FF80AB'],
                  type: 'marker',
                  customPicker: true
                }
              },

              // Herramienta 2: Color de Texto (TextColor)
              TextColor: {
                class: window.ColorPlugin,
                config: {
                  colorCollections: ['#E53935', '#1E88E5', '#43A047', '#FB8C00', '#8E24AA'],
                  type: 'text',
                  customPicker: true
                }
              },

              inlineCode: { class: InlineCode },
              embed: { class: Embed, config: { services: { youtube: true } } },
              image: {
                class: ImageTool,
                config: {
                  uploader: {
                    async uploadByFile(file) {
                      try {
                        const fileName = `${Date.now()}_${file.name}`;

                        if (error) throw error;
                        const { data: publicUrlData } = supabaseClient.storage.from('imagenes-diapositivas').getPublicUrl(fileName);
                        return { success: 1, file: { url: publicUrlData.publicUrl } };
                      } catch (err) {
                        alert('Error al subir imagen: ' + err.message);
                        return { success: 0 };
                      }
                    }
                  }
                }
              }
            },
            // Habilitar la alineación por defecto para todos los bloques comunes
            tunes: ['alignmentTune'],
            onChange: async () => {
              const savedData = await editorInstance.save();
              slides.value[activeSlideIndex.value] = savedData;
              actualizarReveal();
            }
          });
          // ---> PEGAR AQUÍ (Justo después de instanciar EditorJS y antes de cerrar la función) <---
          nextTick(() => {
            const holder = document.getElementById('editorjs-holder');
            if (holder) {
              document.addEventListener('click', async (e) => {
                if (e.target.closest('.ce-popover') || e.target.closest('.ce-toolbar')) {
                  setTimeout(async () => {
                    if (editorInstance && typeof editorInstance.save === 'function') {
                      const savedData = await editorInstance.save();
                      slides.value[activeSlideIndex.value] = savedData;
                      actualizarReveal();
                    }
                  }, 100);
                }
              });
            }
          });
        };

        // Renderizado e Inicialización de Reveal.js
        const actualizarReveal = () => {
          const slidesContainer = document.getElementById('slides-container');
          if (!slidesContainer) return;

          // Construye las secciones HTML para cada slide
          const htmlSlides = slides.value.map(slideData => {
            const innerHTML = editorJsToHtml(slideData);
            return `<section>${innerHTML || '<h3>Diapositiva Vacía</h3>'}</section>`;
          }).join('\n');

          slidesContainer.innerHTML = htmlSlides;

          nextTick(() => {
            if (revealInstance) revealInstance.destroy();

            revealInstance = new Reveal(revealRef.value, {
              embedded: true,
              keyboardCondition: 'focused',
              center: true,
              slideNumber: 'c/t',
              controls: true,
              progress: true,
              width: 1280,
              height: 720,
            });

            revealInstance.initialize().then(() => {
              aplicarEstilo();
              aplicarTipografia();
              if (revealInstance && typeof revealInstance.slide === 'function') {
                revealInstance.slide(activeSlideIndex.value, 0);
              }
            });
          });
        };

        // Cambio de pestaña/slide
        watch(activeSlideIndex, async (newIndex) => {
          if (slides.value[newIndex]) {
            await inicializarEditorJS(slides.value[newIndex]);
            if (revealInstance && typeof revealInstance.slide === 'function') {
              revealInstance.slide(newIndex, 0);
            }
          }
        });

        const agregarDiapositiva = async () => {
          const nuevaSlide = {
            blocks: [{ type: 'header', data: { text: `Nueva Diapositiva`, level: 2 } }]
          };

          // Inserta la nueva diapositiva justo después del índice activo
          slides.value.splice(activeSlideIndex.value + 1, 0, nuevaSlide);

          // Cambia el enfoque a la nueva diapositiva recién creada
          activeSlideIndex.value = activeSlideIndex.value + 1;
        };

        const eliminarDiapositivaActual = () => {
          if (slides.value.length <= 1) return;
          slides.value.splice(activeSlideIndex.value, 1);
          if (activeSlideIndex.value >= slides.value.length) {
            activeSlideIndex.value = slides.value.length - 1;
          } else {
            inicializarEditorJS(slides.value[activeSlideIndex.value]);
            actualizarReveal();
          }
        };

        const moverDiapositivaIzquierda = () => {
          if (activeSlideIndex.value > 0) {
            const slideActual = slides.value.splice(activeSlideIndex.value, 1)[0];
            slides.value.splice(activeSlideIndex.value - 1, 0, slideActual);
            activeSlideIndex.value--;
          }
        };

        const moverDiapositivaDerecha = () => {
          if (activeSlideIndex.value < slides.value.length - 1) {
            const slideActual = slides.value.splice(activeSlideIndex.value, 1)[0];
            slides.value.splice(activeSlideIndex.value + 1, 0, slideActual);
            activeSlideIndex.value++;
          }
        };

        // Persistencia con Supabase
        const guardarPresentacion = async () => {
          if (!presentationTitle.value.trim()) {
            alert('Por favor asigna un nombre a la presentación.');
            return;
          }

          cargandoGuardado.value = true;
          try {
            // Guarda el contenido activo del editor en el arreglo
            if (editorInstance) {
              slides.value[activeSlideIndex.value] = await editorInstance.save();
            }

            const themeConfig = {
              gradient: gradientes.value[selectedGradient.value].value,
              fontPair: selectedFontPair.value
            };

            const payload = {
              title: presentationTitle.value.trim(),
              course: currentCourse.value.trim() || 'General',
              content_json: slides.value, // Nueva Columna JSON
              theme_config: themeConfig,
              is_published: true,
              updated_at: new Date()
            };

            if (currentId.value) {
              payload.id = currentId.value;
            }

            const { data, error } = await supabaseClient
              .from('presentations')
              .upsert(payload, { onConflict: 'title' })
              .select();

            if (error) throw error;

            if (data && data.length > 0) {
              currentId.value = data[0].id;

            alert(`¡Presentación "${presentationTitle.value}" guardada correctamente!`);
            await obtenerPresentaciones();
          } catch (err) {
            alert('Error al guardar en Supabase: ' + err.message);
          } finally {
            cargandoGuardado.value = false;
          }
        };

        const obtenerPresentaciones = async () => {
          cargandoLista.value = true;
          try {
            const { data, error } = await supabaseClient
              .from('presentations')
              .select('id, title, content_json, theme_config, course')
              .order('course', { ascending: true })
              .order('updated_at', { ascending: false });

            if (error) throw error;

            listaPresentaciones.value = (data || []).map(item => ({
              ...item,
              course: item.course || 'Sin Curso'
            }));

            const cursosUnicos = [...new Set(listaPresentaciones.value.map(p => p.course))];
            if (cursosUnicos.length > 0) listaCursos.value = cursosUnicos;
          } catch (err) {
            console.error('Error al listar presentaciones:', err.message);
          } finally {
            cargandoLista.value = false;
          }
        };

        const cargarPresentacionSeleccionada = async (id) => {
          const item = listaPresentaciones.value.find(p => p.id === id);
          if (!item) return;

          currentId.value = item.id;
          presentationTitle.value = item.title;
          currentCourse.value = item.course || 'General';

          // Lógica Fallback: Preferir JSON, si no existe, procesar Markdown antiguo
          if (item.content_json && Array.isArray(item.content_json) && item.content_json.length > 0) {
            slides.value = item.content_json;
          } else if (item.content_markdown) {
            // Dividir las diapositivas antiguas si usabas separadores como '---'
            const markdownSlides = item.content_markdown.split('---');
            slides.value = markdownSlides.map(text => ({
              blocks: [
                { type: 'paragraph', data: { text: text.trim() } }
              ]
            }));
          } else {
            slides.value = [{ blocks: [{ type: 'header', data: { text: item.title, level: 2 } }] }];
          }

          if (item.content_json && Array.isArray(item.content_json)) {
            slides.value = item.content_json;
          } else {
            slides.value = [{ blocks: [{ type: 'header', data: { text: item.title, level: 2 } }] }];
          }

          if (item.theme_config?.gradient !== undefined) {
            const indexGrad = gradientes.value.findIndex(g => g.value === item.theme_config.gradient);
            if (indexGrad !== -1) selectedGradient.value = indexGrad;
          }

          if (item.theme_config?.fontPair) {
            selectedFontPair.value = item.theme_config.fontPair;
            aplicarTipografia();
          }

          activeSlideIndex.value = 0;
          await inicializarEditorJS(slides.value[0]);

        };

        const eliminarPresentacion = async () => {

            const { error } = await supabaseClient.from('presentations').delete().eq('id', currentId.value);

            currentId.value = null;

            activeSlideIndex.value = 0;
            await inicializarEditorJS(slides.value[0]);
            await obtenerPresentaciones();
            actualizarReveal();
          } catch (err) {
            alert('Error al eliminar: ' + err.message);
          } finally {
            cargandoEliminar.value = false;
          }
        };



        // Tipografías y Gradientes

        // Tipografías
        const fontPairs = [
          {
            id: 'montserrat-inter',
            label: 'Montserrat / Inter',
            titleFont: 'Montserrat',
            bodyFont: 'Inter',
            url: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap'
          },
          {
            id: 'playfair-lato',
            label: 'Playfair / Lato',
            titleFont: 'Playfair Display',
            bodyFont: 'Lato',
            url: 'https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700;800&display=swap'
          },
          {
            id: 'poppins-nunito',
            label: 'Poppins / Nunito',
            titleFont: 'Poppins',
            bodyFont: 'Nunito',
            url: 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Poppins:wght@700;800&display=swap'
          },
          {
            id: 'space-grotesk-roboto',
            label: 'Space Grotesk / Roboto',
            titleFont: 'Space Grotesk',
            bodyFont: 'Roboto',
            url: 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Space+Grotesk:wght@700&display=swap'
          }
        ];

        const selectedFontPair = ref('montserrat-inter');

        const aplicarTipografia = () => {
          const pair = fontPairs.find(p => p.id === selectedFontPair.value) || fontPairs[0];
          if (!document.querySelector(`link[href="${pair.url}"]`)) {
            const link = document.createElement('link');

            revealRef.value.style.setProperty('--body-font', `'${pair.bodyFont}', sans-serif`);
          }
        };

        const gradientes = ref([
          { name: 'Verde Esmeralda', value: 'linear-gradient(135deg, #052e16 0%, #14532d 50%, #15803d 100%)' },
          { name: 'Púrpura Neón', value: 'linear-gradient(135deg, #240b36 0%, #c31432 100%)' },
          { name: 'Azul Cósmico', value: 'linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%)' },
          { name: 'Bosque Profundo', value: 'linear-gradient(135deg, #134e5e 0%, #71b280 100%)' },
          { name: 'Café Calidez', value: 'linear-gradient(135deg, #271c19 0%, #4a2e2b 50%, #78350f 100%)' },
          { name: 'Aqua', value: 'linear-gradient(90deg, #07aeea 0.000%, #2bf598 100.000%)' },
          { name: 'Mar', value: 'linear-gradient(90deg, #a47451 0.000%, #9c9881 16.667%, #73a09d 33.333%, #3b899a 50.000%, #095b79 66.667%, #002847 83.333%, #000116 100.000%)' },
          { name: 'Elegante', value: 'linear-gradient(90deg, #121216 0.000%, #121216 7.692%, #16171a calc(7.692% + 1px), #16171a 15.385%, #1a1b1f calc(15.385% + 1px), #1a1b1f 23.077%, #1f2023 calc(23.077% + 1px), #1f2023 30.769%, #232427 calc(30.769% + 1px), #232427 38.462%, #27282b calc(38.462% + 1px), #27282b 46.154%, #2b2c2f calc(46.154% + 1px), #2b2c2f 53.846%, #2f3033 calc(53.846% + 1px), #2f3033 61.538%, #323337 calc(61.538% + 1px), #323337 69.231%, #36373a calc(69.231% + 1px), #36373a 76.923%, #38393d calc(76.923% + 1px), #38393d 84.615%, #3b3c40 calc(84.615% + 1px), #3b3c40 92.308%, #3d3e42 calc(92.308% + 1px) 100.000%)' },
          { name: 'Serio', value: 'linear-gradient(90deg, #2f1136 0.000%, #2f1136 7.692%, #341234 calc(7.692% + 1px), #341234 15.385%, #3a1634 calc(15.385% + 1px), #3a1634 23.077%, #421c38 calc(23.077% + 1px), #421c38 30.769%, #4a233e calc(30.769% + 1px), #4a233e 38.462%, #532d46 calc(38.462% + 1px), #532d46 46.154%, #5b3751 calc(46.154% + 1px), #5b3751 53.846%, #63435d calc(53.846% + 1px), #63435d 61.538%, #69506b calc(61.538% + 1px), #69506b 69.231%, #6e5c7a calc(69.231% + 1px), #6e5c7a 76.923%, #70688a calc(76.923% + 1px), #70688a 84.615%, #707499 calc(84.615% + 1px), #707499 92.308%, #6e7ea9 calc(92.308% + 1px) 100.000%)' },
          { name: 'Divertido', value: 'linear-gradient(225deg, #631683 0.000%, #7f237e 14.286%, #9e3980 28.571%, #bc5588 42.857%, #d57496 57.143%, #e494a8 71.429%, #e7b1be 85.714%, #dec8d6 100.000%)' },
          { name: 'Morado', value: 'linear-gradient(335deg, #ffc695 0.000%, #636676 50.000%, #001426 100.000%)' },
          { name: 'Azul', value: ' linear-gradient(135deg, #000032 0.000%, #184664 50.000%, #4eb490 100.000%)' },
          { name: 'Azul_Dos', value: 'linear-gradient(0deg, #0a0000 0.000%, #250a26 25.000%, #49457a 50.000%, #767baa 75.000%, #aba9b5 100.000%)' }
        ]);

        const selectedGradient = ref(0);

        const aplicarEstilo = () => {
          const gradientValue = gradientes.value[selectedGradient.value].value;
          if (revealRef.value) revealRef.value.style.background = gradientValue;
        };

        const abrirVisorNuevaPestana = () => {
          if (!presentationTitle.value.trim()) return alert('Asigna un nombre al proyecto primero.');
          const urlVisor = `viewer_new.html?title=${encodeURIComponent(presentationTitle.value.trim())}`;
          window.open(urlVisor, '_blank');
        };

        const presentacionesFiltradas = computed(() => {
          if (!currentCourse.value) return listaPresentaciones.value;
          const curso = typeof currentCourse.value === 'object' ? currentCourse.value.title : currentCourse.value;
          return listaPresentaciones.value.filter(p => p.course === curso);
        });

        onMounted(async () => {
          await obtenerPresentaciones();
          await inicializarEditorJS(slides.value[0]);
          actualizarReveal();
        });

        return {
          presentationTitle,
          currentCourse,
          listaCursos,
          slides,
          activeSlideIndex,
          revealRef,
          cargandoGuardado,
          cargandoEliminar,
          cargandoLista,
          listaPresentaciones,
          selectedPresentationId,
          presentacionesFiltradas,
          fontPairs,
          selectedFontPair,
          gradientes,
          selectedGradient,
          agregarDiapositiva,
          eliminarDiapositivaActual,
          moverDiapositivaIzquierda,
          moverDiapositivaDerecha,
          guardarPresentacion,
          cargarPresentacionSeleccionada,
          currentId,             // <--- Para que funcione el v-if="currentId"
          cargandoEliminar,      // <--- Para el :loading del botón
          eliminarPresentacion,
          aplicarTipografia,
          aplicarEstilo,
          abrirVisorNuevaPestana,
          dialogEmbed,
          iframeCode,
