  <!-- Reveal.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/theme/night.css">

  <style>
    .editor-textarea textarea {
      font-family: 'Fira Code', 'Courier New', monospace !important;
      font-size: 14px;
    }

    .reveal-container {
      width: 100%;
      height: 480px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }

    .title-input {
      max-width: 300px;
    }

    .reveal .slides section {
      text-align: left;
    }

    /* Base Slide Typography */
    .reveal,
    .reveal .slides,
    .reveal .slides section,
    .reveal .slides section p,
    .reveal .slides section li,
    .reveal .slides section span,
    .reveal .slides section a {
      font-family: var(--body-font, 'Inter', sans-serif) !important;
    }

    /* Slide Body Text Sizing */
    .reveal .slides section p,
    .reveal .slides section li,
    .reveal .slides section span,
    .reveal .slides section a {
      font-size: 0.8em;
      line-height: 1.4 !important;
    }

    /* Slide Headings */
    .reveal .slides section h1,
    .reveal .slides section h2,
    .reveal .slides section h3,
    .reveal .slides section h4,
    .reveal .slides section h5,
    .reveal .slides section h6 {
      font-family: var(--title-font, 'Montserrat', sans-serif) !important;
      font-weight: 800 !important;
      text-transform: none !important;
    }

    /* Mejora visual para los tags <mark> en Reveal.js */
    .reveal mark {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* Clases de tamaño para Reveal.js */
    .reveal .text-xs {
      font-size: 0.55em !important;
    }

    .reveal .text-sm {
      font-size: 0.8em !important;
    }

    .reveal .text-lg {
      font-size: 1.25em !important;
    }

    .reveal .text-xl {
      font-size: 1.6em !important;
    }
  </style>
</head>

      setup() {
        const editorRef = ref(null);
        const revealRef = ref(null);
        const fileInput = ref(null);

        // Estado de la presentación
        const currentId = ref(null);
        const presentationTitle = ref('Mi Presentación Clase 1');
        const markdownText = ref(`## Diapositiva 1\nEscribe aquí el contenido de tu clase...`);

        const subiendoImagen = ref(false);
        const cargandoGuardado = ref(false);
        const dialogYouTube = ref(false);
        const youtubeUrl = ref('');

        let revealInstance = null;

        const insertarEnCursor = (textoAInsertar) => {
          const textarea = editorRef.value.$el.querySelector('textarea');
          const inicio = textarea.selectionStart;
          const fin = textarea.selectionEnd;

          markdownText.value = markdownText.value.substring(0, inicio) + textoAInsertar + markdownText.value.substring(fin);

          nextTick(() => {
            textarea.selectionStart = textarea.selectionEnd = inicio + textoAInsertar.length;
            textarea.focus();
            actualizarReveal();
          });
        };

        const triggerFileInput = () => fileInput.value.click();

        const subirImagenSupabase = async (event) => {
          const file = event.target.files[0];
          if (!file) return;

          subiendoImagen.value = true;
          try {
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient
              .storage
              .from('imagenes-diapositivas')
              .upload(fileName, file);

            if (error) throw error;

            const { data: publicUrlData } = supabaseClient
              .storage
              .from('imagenes-diapositivas')
              .getPublicUrl(fileName);

            const htmlImage = `\n<img src="${publicUrlData.publicUrl}" width="500" style="display: block; margin: 0 auto;" />\n`;
            insertarEnCursor(htmlImage);
            actualizarReveal();
          } catch (err) {
            alert('Error al subir la imagen: ' + err.message);
          } finally {
            subiendoImagen.value = false;
            event.target.value = '';
          }
        };

        const dialogGaleria = ref(false);
        const imagenesGaleria = ref([]);
        const cargandoEliminar = ref(false);

        const eliminarPresentacion = async () => {
          if (!currentId.value) return;

          const confirmacion = confirm(`¿Estás seguro de que deseas eliminar la presentación "${presentationTitle.value}"? Esta acción no se puede deshacer.`);
          if (!confirmacion) return;

          cargandoEliminar.value = true;
          try {
            const { error } = await supabaseClient
              .from('presentations')
              .delete()
              .eq('id', currentId.value);

            if (error) throw error;

            alert('Presentación eliminada correctamente.');

            currentId.value = null;
            selectedPresentationId.value = null;
            presentationTitle.value = 'Mi Nueva Presentación';
            markdownText.value = '## Diapositiva 1\nEscribe aquí el contenido...';

            await obtenerPresentaciones();
            actualizarReveal();
          } catch (err) {
            alert('Error al eliminar: ' + err.message);
          } finally {
            cargandoEliminar.value = false;
          }
        };

        const abrirGaleriaMedios = async () => {
          dialogGaleria.value = true;
          try {
            const { data, error } = await supabaseClient
              .storage
              .from('imagenes-diapositivas')
              .list();

            if (error) throw error;

            imagenesGaleria.value = (data || [])
              .filter(file => file.name !== '.emptyFolderPlaceholder')
              .map(file => {
                const { data: publicUrlData } = supabaseClient
                  .storage
                  .from('imagenes-diapositivas')
                  .getPublicUrl(file.name);

                return {
                  name: file.name,
                  url: publicUrlData.publicUrl
                };
              });
          } catch (err) {
            alert('Error al cargar la galería: ' + err.message);
          }
        };

        const insertarImagenDesdeGaleria = (url) => {
          const htmlImage = `\n<img src="${url}" width="500" style="display: block; margin: 0 auto;" />\n`;
          insertarEnCursor(htmlImage);
          dialogGaleria.value = false;
        };

        const dialogConfirmarBorrado = ref(false);
        const imagenABorrar = ref('');
        const cargandoBorradoImg = ref(false);

        const confirmarBorradoImagen = (fileName) => {
          imagenABorrar.value = fileName;
          dialogConfirmarBorrado.value = true;
        };

        const ejecutarEliminarImagen = async () => {
          if (!imagenABorrar.value) return;

          cargandoBorradoImg.value = true;
          try {
            const { error } = await supabaseClient
              .storage
              .from('imagenes-diapositivas')
              .remove([imagenABorrar.value]);

            if (error) throw error;

            imagenesGaleria.value = imagenesGaleria.value.filter(img => img.name !== imagenABorrar.value);

            dialogConfirmarBorrado.value = false;
            imagenABorrar.value = '';
          } catch (err) {
            alert('Error al eliminar la imagen: ' + err.message);
          } finally {
            cargandoBorradoImg.value = false;
          }
        };

        const insertarYouTube = () => {
          if (!youtubeUrl.value) return;
          const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
          const match = youtubeUrl.value.match(regExp);
          const videoId = (match && match[2].length === 11) ? match[2] : youtubeUrl.value;

          insertarEnCursor(`\n<iframe data-src="https://www.youtube.com/embed/${videoId}" width="100%" height="500px" frameborder="0" allowfullscreen></iframe>\n`);
          dialogYouTube.value = false;
          youtubeUrl.value = '';
        };

        const insertarDosColumnas = () => {
          const plantilla = `\n<div style="display: flex; gap: 20px; align-items: center;">\n  <div style="flex: 1;">\n\n### Columna 1\nTexto...\n\n  </div>\n  <div style="flex: 1;">\n\n### Columna 2\nTexto...\n\n  </div>\n</div>\n`;
          insertarEnCursor(plantilla);
        };

        // const insertarIframe = () => {
        //   const url = prompt("URL del foro o página web:", "https://");
        //   if (url) {
        //     insertarEnCursor(`\n<iframe data-src="${url}" width="100%" height="800px" style="border:none;"></iframe>\n`);
        //   }
        // };

        // Estados reactivos para el modal de iFrame
        const dialogIframe = ref(false);
        const iframeUrl = ref('');

        // Abrir modal al hacer clic en el botón
        const insertarIframe = () => {
          iframeUrl.value = 'https://';
          dialogIframe.value = true;
        };

        // Confirmar e insertar el iFrame en el editor
        const confirmarInsertarIframe = () => {
          if (!iframeUrl.value.trim()) return;

          let url = iframeUrl.value.trim();
          if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
          }

          insertarEnCursor(`\n<iframe data-src="${url}" width="100%" height="800px" style="border:none;"></iframe>\n`);
          dialogIframe.value = false;
          iframeUrl.value = '';
        };

        const listaPresentaciones = ref([]);
        const selectedPresentationId = ref(null);
        const cargandoLista = ref(false);

        const obtenerPresentaciones = async () => {
          cargandoLista.value = true;
          try {
            const { data, error } = await supabaseClient
              .from('presentations')
              .select('id, title, content_markdown, theme_config')
              .order('updated_at', { ascending: false });

            if (error) throw error;
            listaPresentaciones.value = data || [];
          } catch (err) {
            console.error('Error al listar presentaciones:', err.message);
          } finally {
            cargandoLista.value = false;
          }
        };

        const cargarPresentacionSeleccionada = (id) => {
          const item = listaPresentaciones.value.find(p => p.id === id);
          if (!item) return;

          currentId.value = item.id;
          presentationTitle.value = item.title;
          markdownText.value = item.content_markdown;

          if (item.theme_config?.gradient !== undefined) {
            const indexGradiente = gradientes.value.findIndex(g => g.value === item.theme_config.gradient);
            if (indexGradiente !== -1) {
              selectedGradient.value = indexGradiente;
            }
          }

          if (item.theme_config?.fontPair) {
            selectedFontPair.value = item.theme_config.fontPair;
            aplicarTipografia();
          }

          actualizarReveal();
        };

        // Guardar Presentación (Incluyendo Tipografía y Gradiente en theme_config)
        const guardarPresentacion = async () => {
          if (!presentationTitle.value.trim()) {
            alert('Por favor asigna un nombre al archivo.');
            return;
          }

          cargandoGuardado.value = true;
          try {
            const themeConfig = {
              gradient: gradientes.value[selectedGradient.value].value,
              fontPair: selectedFontPair.value
            };

            const payload = {
              title: presentationTitle.value.trim(),
              content_markdown: markdownText.value,
              theme_config: themeConfig,
              is_published: true,
              updated_at: new Date()
            };

            if (currentId.value) {
              payload.id = currentId.value;
            }

            const { data, error } = await supabaseClient
              .from('presentations')
              .upsert(payload, { onConflict: 'title' })
              .select();

            if (error) throw error;

            if (data && data.length > 0) {
              currentId.value = data[0].id;
            }

            alert(`¡Proyecto "${presentationTitle.value}" guardado correctamente en Supabase!`);
            await obtenerPresentaciones();
          } catch (err) {
            alert('Error al guardar: ' + err.message);
          } finally {
            cargandoGuardado.value = false;
          }
        };

        // Tipografías
        const fontPairs = [
          {
            id: 'montserrat-inter',
            label: 'Montserrat / Inter',
            titleFont: 'Montserrat',
            bodyFont: 'Inter',
            url: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap'
          },
          {
            id: 'playfair-lato',
            label: 'Playfair / Lato',
            titleFont: 'Playfair Display',
            bodyFont: 'Lato',
            url: 'https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700;800&display=swap'
          },
          {
            id: 'poppins-nunito',
            label: 'Poppins / Nunito',
            titleFont: 'Poppins',
            bodyFont: 'Nunito',
            url: 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Poppins:wght@700;800&display=swap'
          },
          {
            id: 'space-grotesk-roboto',
            label: 'Space Grotesk / Roboto',
            titleFont: 'Space Grotesk',
            bodyFont: 'Roboto',
            url: 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Space+Grotesk:wght@700&display=swap'
          }
        ];

        const selectedFontPair = ref('montserrat-inter');

        const cargarGoogleFont = (url) => {
          if (!document.querySelector(`link[href="${url}"]`)) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = url;
            document.head.appendChild(link);
          }
        };

        const aplicarTipografia = () => {
          const pair = fontPairs.find(p => p.id === selectedFontPair.value) || fontPairs[0];
          cargarGoogleFont(pair.url);

          if (revealRef.value) {
            revealRef.value.style.setProperty('--title-font', `'${pair.titleFont}', sans-serif`);
            revealRef.value.style.setProperty('--body-font', `'${pair.bodyFont}', sans-serif`);
          }
        };

        // Gradientes
        const gradientes = ref([
          { name: 'Verde Esmeralda', value: 'linear-gradient(135deg, #052e16 0%, #14532d 50%, #15803d 100%)' },
          { name: 'Púrpura Neón', value: 'linear-gradient(135deg, #240b36 0%, #c31432 100%)' },
          { name: 'Azul Cósmico', value: 'linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%)' },
          { name: 'Bosque Profundo', value: 'linear-gradient(135deg, #134e5e 0%, #71b280 100%)' },
          { name: 'Café Calidez', value: 'linear-gradient(135deg, #271c19 0%, #4a2e2b 50%, #78350f 100%)' }
        ]);

        const selectedGradient = ref(0);

        const aplicarEstilo = () => {
          const gradientValue = gradientes.value[selectedGradient.value].value;
          nextTick(() => {
            if (revealRef.value) {
              revealRef.value.style.background = gradientValue;
            }
          });
        };

        const insertarSaltoDobleHTML = () => {
          insertarEnCursor('<br><br>');
        };

        const alinearTexto = (alineacion) => {
          const textarea = editorRef.value.$el.querySelector('textarea');
          const inicio = textarea.selectionStart;
          const fin = textarea.selectionEnd;
          const textoSeleccionado = markdownText.value.substring(inicio, fin);

          if (textoSeleccionado) {
            const textoAlineado = `<div style="text-align: ${alineacion};">\n\n${textoSeleccionado}\n\n</div>`;
            markdownText.value = markdownText.value.substring(0, inicio) + textoAlineado + markdownText.value.substring(fin);
          } else {
            insertarEnCursor(`<div style="text-align: ${alineacion};">\n\nTexto aquí...\n\n</div>\n`);
          }

          actualizarReveal();
        };

        const insertarEnlaceHtml = () => {
          const textarea = editorRef.value.$el.querySelector('textarea');
          const inicio = textarea.selectionStart;
          const fin = textarea.selectionEnd;
          const textoSeleccionado = markdownText.value.substring(inicio, fin);

          const texto = prompt("Texto a mostrar en la diapositiva:", textoSeleccionado || "Texto disfrazado aquí");
          if (!texto) return;

          let url = prompt("Dirección web (URL):", "https://");
          if (!url) return;

          if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
          }

          const htmlLink = `<a href="${url}" target="_blank" >${texto}</a>`;

          if (textoSeleccionado) {
            markdownText.value = markdownText.value.substring(0, inicio) + htmlLink + markdownText.value.substring(fin);
          } else {
            insertarEnCursor(htmlLink);
          }

          actualizarReveal();
        };

        const abrirVisorNuevaPestana = () => {
          if (!presentationTitle.value.trim()) {
            alert('Asigna un nombre al proyecto para abrir su vista previa completa.');
            return;
          }

          const tituloEncoded = encodeURIComponent(presentationTitle.value.trim());

          // 1. Obtiene la ruta de la carpeta actual donde se ejecuta index.html
          // (por ejemplo: '/gbda412/' en GH Pages o '/home/lui/Documents/slidesEditor/' en local)
          const currentPath = window.location.pathname.substring(
            0,
            window.location.pathname.lastIndexOf('/') + 1
          );

          // 2. Construye la URL combinando el origen y la ruta relativa
          const urlVisor = `${window.location.origin}${currentPath}/viewer.html?title=${tituloEncoded}`;

          window.open(urlVisor, '_blank');
        };

        const copiarIframeViewer = () => {
          if (!presentationTitle.value.trim()) {
            alert('Asigna un nombre al proyecto para obtener su enlace.');
            return;
          }

          const tituloEncoded = encodeURIComponent(presentationTitle.value.trim());

          // Obtiene la ruta actual donde reside el editor
          const currentPath = window.location.pathname.substring(
            0,
            window.location.pathname.lastIndexOf('/') + 1
          );

          // Construye la URL relativa limpia apuntando a viewer.html
          const urlViewer = `${window.location.origin}${currentPath}viewer.html?title=${tituloEncoded}`;

          const iframeCode = `<iframe src="${urlViewer}" width="100%" height="500px" style="border: none; border-radius: 8px;" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>`;

          navigator.clipboard.writeText(iframeCode).then(() => {
            alert(`¡Código iFrame copiado al portapapeles!\n\n${iframeCode}`);
          }).catch(err => {
            console.error('Error al copiar: ', err);
            alert('No se pudo copiar automáticamente. Copia este código manualmente:\n\n' + iframeCode);
          });
        };

        // Función genérica para envolver el texto seleccionado con <mark>
        const insertarMark = (color = null) => {
          const textarea = editorRef.value?.$el?.querySelector('textarea') || editorRef.value;
          if (!textarea) return;

          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          const textoSeleccionado = markdownText.value.substring(start, end);

          // Si no hay texto seleccionado, usa un texto por defecto
          const contenido = textoSeleccionado || 'Texto destacado';

          // Construye el tag con o sin estilo de color
          const estiloColor = color ? ` style="background-color: ${color}; color: #000;"` : '';
          const etiquetaMark = `<mark${estiloColor}>${contenido}</mark>`;

          // Reemplaza o inserta en la posición del cursor
          markdownText.value =
            markdownText.value.substring(0, start) +
            etiquetaMark +
            markdownText.value.substring(end);

          actualizarReveal();
        };

        // Función para cambiar el tamaño del texto usando clases de Reveal
        const cambiarTamanoTexto = (claseTamano) => {
          const textarea = editorRef.value?.$el?.querySelector('textarea') || editorRef.value;
          if (!textarea) return;

          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          const textoSeleccionado = markdownText.value.substring(start, end).trim();

          if (textoSeleccionado) {
            // Siempre envuelve en un <div> dejando saltos de línea para que Markdown no falle
            const textoConClase = `<div class="${claseTamano}">\n\n${textoSeleccionado}\n\n</div>`;
            markdownText.value =
              markdownText.value.substring(0, start) +
              textoConClase +
              markdownText.value.substring(end);
          } else {
            // Plantilla por defecto si no hay selección
            const textoBase = `\n<div class="${claseTamano}">\n\nTexto de ejemplo...\n\n</div>\n`;
            insertarEnCursor(textoBase);
          }

          actualizarReveal();
        };

        // //////////

        const actualizarReveal = () => {
          let slideIndex = 0;
          if (editorRef.value) {
            const textarea = editorRef.value.$el.querySelector('textarea');
            if (textarea) {
              const cursorPos = textarea.selectionStart;
              const textoHastaCursor = markdownText.value.substring(0, cursorPos);

              const matches = textoHastaCursor.match(/^---$/gm);
              if (matches) {
                slideIndex = matches.length;
              }
            }
          }



          nextTick(() => {
            if (revealInstance) revealInstance.destroy();

            const slidesContainer = revealRef.value.querySelector('.slides');
            if (slidesContainer) {
              slidesContainer.innerHTML = `
                <section data-markdown>
                  <textarea data-template>${markdownText.value}</textarea>
                </section>
              `;
            }

            revealInstance = new Reveal(revealRef.value, {
              plugins: [RevealMarkdown],
              embedded: true,
              keyboardCondition: 'focused',
              center: true,
              slideNumber: 'c/t',
              // controls: true,
              controlsBackArrows: 'visible',
              progress: true,
              controlsLayout: 'edges',
              overview: true,
              // previewLinks: true,
              autoAnimate: true,
              width: 1280,
              height: 720,

              // Factor de escala: reduce el margen alrededor de la diapositiva
              margin: 0.02, // Valor por defecto es 0.1 (al bajarlo a 0.02 ganas mucho espacio)

              // Límites de escalado para pantallas grandes
              minScale: 0.2,
              maxScale: 2.0,

            });

            revealInstance.initialize().then(() => {
              aplicarEstilo();
              aplicarTipografia();

              if (revealInstance && typeof revealInstance.slide === 'function') {
                revealInstance.slide(slideIndex, 0);
              }
            });
          });
        };

        onMounted(() => {
          obtenerPresentaciones();
          actualizarReveal();
        });

        return {
          markdownText,
          presentationTitle,
          editorRef,
          revealRef,
          fileInput,
          subiendoImagen,
          cargandoGuardado,
          dialogYouTube,
          youtubeUrl,
          gradientes,
          selectedGradient,
          aplicarEstilo,
          fontPairs,
          selectedFontPair,
          aplicarTipografia,
          insertarSaltoDobleHTML,
          alinearTexto,
          insertarEnlaceHtml,
          listaPresentaciones,
          selectedPresentationId,
          cargandoLista,
          cargarPresentacionSeleccionada,
          triggerFileInput,
          subirImagenSupabase,
          currentId,
          cargandoEliminar,
          eliminarPresentacion,
          dialogGaleria,
          imagenesGaleria,
          abrirGaleriaMedios,
          insertarImagenDesdeGaleria,
          dialogConfirmarBorrado,
          imagenABorrar,
          cargandoBorradoImg,
          confirmarBorradoImagen,
          ejecutarEliminarImagen,
          insertarYouTube,
          insertarDosColumnas,
          abrirVisorNuevaPestana,
          dialogIframe,
          iframeUrl,
          insertarIframe,
          confirmarInsertarIframe,
          copiarIframeViewer,
          insertarMark,
          guardarPresentacion,
          cambiarTamanoTexto,
          actualizarReveal
        };
      }
    };

    createApp(App).use(vuetify).mount('#app');
  </script>
</body>

</html>
