<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación</title>

    <!-- Reveal.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/theme/night.css">

    <style>
        /* 1. Reset base */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        .reveal {
            width: 100vw;
            height: 100vh;
        }

        /* 2. Tipografía para el cuerpo del texto usando variables CSS */
        .reveal,
        .reveal .slides,
        .reveal .slides section,
        .reveal .slides section p,
        .reveal .slides section li,
        .reveal .slides section span,
        .reveal .slides section a,
        .reveal .slides section div {
            font-family: var(--body-font, 'Inter', sans-serif) !important;
        }

        /* Alineación predeterminada */
        .reveal .slides section {
            text-align: left;
        }

        /* 3. Escalar texto del cuerpo */
        .reveal .slides section p,
        .reveal .slides section li,
        .reveal .slides section span,
        .reveal .slides section a {
            font-size: 1em;
            line-height: 1 !important;
        }

        /* 4. Tipografía para Títulos */
        .reveal .slides section h1,
        .reveal .slides section h2,
        .reveal .slides section h3,
        .reveal .slides section h4,
        .reveal .slides section h5,
        .reveal .slides section h6 {
            font-family: var(--title-font, 'Montserrat', sans-serif) !important;
            font-weight: 800 !important;
            text-transform: none !important;
        }

        /* Prevenir saltos de línea extraños */
        .reveal .slides section p,
        .reveal .slides section h1,
        .reveal .slides section h2,
        .reveal .slides section h3,
        .reveal .slides section h4,
        .reveal .slides section ul,
        .reveal .slides section ol,
        .reveal .slides section blockquote {
            white-space: pre-wrap;
            text-align: inherit;
        }

        /* Mejora visual para los tags <mark> */
        .reveal mark {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        /* 💡 ESTILOS PARA COLUMNAS EN REVEAL.JS 💡 */
        .reveal .editor-columns-container {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            gap: 20px !important;
            width: 100% !important;
            margin: 15px 0 !important;
        }

        .reveal .editor-column {
            flex: 1 1 0px !important;
            min-width: 0 !important;
        }

        .reveal .editor-column img {
            max-width: 100% !important;
            height: auto !important;
        }

        /* Estilos para tablas invisibles/limpias */
        .reveal table.invisible-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .reveal table.invisible-table td {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
        }

        /* Clases de tamaño */
        .reveal .text-xs { font-size: 0.55em !important; }
        .reveal .text-sm { font-size: 0.8em !important; }
        .reveal .text-lg { font-size: 1.25em !important; }
        .reveal .text-xl { font-size: 1.6em !important; }
    </style>
</head>

<body>

    <div class="reveal" id="reveal-deck">
        <div class="slides" id="slides-container">
            <section>Cargando presentación...</section>
        </div>
    </div>

    <!-- Supabase & Reveal.js Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.js"></script>

    <script>
        const SUPABASE_URL = 'https://jomqgtqtwgaxdgwywhtg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvbXFndHF0d2dheGRnd3l3aHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MTkyNDgsImV4cCI6MjA5ODQ5NTI0OH0.aTKt1oLBpyMMNL0S2Lcv3C1ZyOkmDcxNP2J2BgxluBg';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const fontPairsMap = {
            'montserrat-inter': {
                title: 'Montserrat',
                body: 'Inter',
                url: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap'
            },
            'playfair-lato': {
                title: 'Playfair Display',
                body: 'Lato',
                url: 'https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700;800&display=swap'
            },
            'poppins-nunito': {
                title: 'Poppins',
                body: 'Nunito',
                url: 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Poppins:wght@700;800&display=swap'
            },
            'space-grotesk-roboto': {
                title: 'Space Grotesk',
                body: 'Roboto',
                url: 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Space+Grotesk:wght@700&display=swap'
            }
        };

        // --- Parser Editor.js JSON -> HTML para Reveal.js ---
        function editorJsToHtml(editorData) {
            if (!editorData || !editorData.blocks || !Array.isArray(editorData.blocks)) return '';

            return editorData.blocks.map(block => {
                if (!block) return '';

                const align = block.tunes?.alignmentTune?.alignment || block.data?.alignment || 'left';
                const alignStyle = `style="text-align: ${align} !important;"`;

                // Función para forzar apertura de enlaces en nueva pestaña
                const formatLinks = (htmlText) => {
                    if (!htmlText) return '';
                    return htmlText.replace(/<a\s+(?:[^>]*?\s+)?href=/gi, '<a target="_blank" rel="noopener noreferrer" href=');
                };

                switch (block.type) {
                    case 'columns':
                        const cols = block.data?.cols || [];
                        const columnsHtml = cols.map(col => {
                            const colContent = editorJsToHtml({ blocks: col.blocks || [] });
                            return `<div class="editor-column">${colContent}</div>`;
                        }).join('');
                        return `<div class="editor-columns-container">${columnsHtml}</div>`;

                    case 'table':
                        const content = block.data?.content || [];
                        const rowsHtml = content.map(row => {
                            const cellsHtml = row.map(cell => `<td>${formatLinks(cell || '')}</td>`).join('');
                            return `<tr>${cellsHtml}</tr>`;
                        }).join('');
                        return `<table class="invisible-table">${rowsHtml}</table>`;

                    case 'header':
                        return `<h${block.data?.level || 2} ${alignStyle}>${formatLinks(block.data?.text || '')}</h${block.data?.level || 2}>`;

                    case 'paragraph':
                        const textWithBreaks = (block.data?.text || '').replace(/\n/g, '<br>');
                        return `<p ${alignStyle}>${formatLinks(textWithBreaks)}</p>`;

                    case 'list':
                        const tag = block.data?.style === 'ordered' ? 'ol' : 'ul';
                        const renderItems = (items) => items.map(item => {
                            const text = typeof item === 'string' ? item : (item.content || '');
                            const subItems = item.items && item.items.length > 0 ? `<${tag}>${renderItems(item.items)}</${tag}>` : '';
                            return `<li>${formatLinks(text)}${subItems}</li>`;
                        }).join('');
                        return `<${tag} ${alignStyle}>${renderItems(block.data?.items || [])}</${tag}>`;

                    case 'image':
                        const imgUrl = block.data?.file?.url || '';
                        if (!imgUrl) return '';
                        const caption = block.data?.caption ? `<figcaption>${formatLinks(block.data.caption)}</figcaption>` : '';
                        return `<figure ${alignStyle}><img src="${imgUrl}" style="max-height: 400px; margin: 0 auto; display: block;" />${caption}</figure>`;

                    case 'embed':
                        return `<iframe data-src="${block.data?.embed || ''}" width="100%" height="400px" frameborder="0" allowfullscreen></iframe>`;

                    case 'quote':
                        return `<blockquote ${alignStyle}>${formatLinks(block.data?.text || '')} <cite>${formatLinks(block.data?.caption || '')}</cite></blockquote>`;

                    case 'raw':
                        return formatLinks(block.data?.html || '');

                    default:
                        return '';
                }
            }).join('\n');
        }

        async function cargarPresentacionPublica() {
            const urlParams = new URLSearchParams(window.location.search);
            const title = urlParams.get('title');

            if (!title) {
                document.getElementById('slides-container').innerHTML = '<section>⚠️ No se especificó el título en la URL.</section>';
                return;
            }

            const { data, error } = await supabaseClient
                .from('presentations')
                .select('title, content_json, content_markdown, theme_config')
                .eq('title', title)
                .single();

            if (error || !data) {
                document.getElementById('slides-container').innerHTML = '<section>⚠️ Presentación no encontrada.</section>';
                return;
            }

            document.title = data.title || title;

            // Cargar tipografías
            const savedFontId = data.theme_config?.fontPair || 'montserrat-inter';
            const fontConfig = fontPairsMap[savedFontId] || fontPairsMap['montserrat-inter'];

            if (!document.querySelector(`link[href="${fontConfig.url}"]`)) {
                const fontLink = document.createElement('link');
                fontLink.rel = 'stylesheet';
                fontLink.href = fontConfig.url;
                document.head.appendChild(fontLink);
            }

            const revealDeck = document.getElementById('reveal-deck');
            revealDeck.style.setProperty('--title-font', `'${fontConfig.title}', sans-serif`);
            revealDeck.style.setProperty('--body-font', `'${fontConfig.body}', sans-serif`);

            // Aplicar gradiente
            const gradienteGuardado = data.theme_config?.gradient || 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)';
            revealDeck.style.background = gradienteGuardado;

            // Renderizar JSON o Markdown
            if (data.content_json && Array.isArray(data.content_json) && data.content_json.length > 0) {
                const htmlSlides = data.content_json.map(slideData => {
                    const innerHTML = editorJsToHtml(slideData);
                    return `<section>${innerHTML || '<h3>Diapositiva Vacía</h3>'}</section>`;
                }).join('\n');

                document.getElementById('slides-container').innerHTML = htmlSlides;

            } else if (data.content_markdown) {
                const markdownSlides = data.content_markdown.split('---');
                const htmlSlides = markdownSlides.map(text => {
                    const textFormatted = text.trim().replace(/\n/g, '<br>');
                    return `<section><p>${textFormatted}</p></section>`;
                }).join('\n');

                document.getElementById('slides-container').innerHTML = htmlSlides;

            } else {
                document.getElementById('slides-container').innerHTML = '<section>⚠️ La presentación no tiene contenido.</section>';
            }

            // Inicializar Reveal.js
            const deck = new Reveal({
                hash: true,
                center: true,
                slideNumber: 'c/t',
                controlsBackArrows: 'visible',
                progress: true,
                controlsLayout: 'edges',
                overview: true,
                autoAnimate: true,
                width: 1280,
                height: 720,
                margin: 0.02,
                minScale: 0.2,
                maxScale: 2.0
            });

            deck.initialize();
        }

        cargarPresentacionPublica();
    </script>
</body>

</html>
